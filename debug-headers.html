<!DOCTYPE html>
<html>
<head>
    <title>Debug Sheet Headers</title>
    <script src="flc-db.js"></script>
    <style>
        body { background: #0b1120; color: white; font-family: monospace; padding: 20px; }
        pre { background: #111827; padding: 15px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Debug: What Headers is Your Sheet Returning?</h1>
    <div id="result">Loading...</div>

    <script>
        async function debug() {
            const div = document.getElementById('result');
            const data = await loadData('bacenta');
            
            if (data && data.length > 0) {
                div.innerHTML = `
                    <h2>✅ Data loaded successfully!</h2>
                    <p><strong>Number of records:</strong> ${data.length}</p>
                    
                    <h3>First record's keys (these are your column headers):</h3>
                    <pre>${JSON.stringify(Object.keys(data[0]), null, 2)}</pre>
                    
                    <h3>First record values:</h3>
                    <pre>${JSON.stringify(data[0], null, 2)}</pre>
                    
                    <h3>All records:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } else {
                div.innerHTML = `
                    <h2>❌ No data found</h2>
                    <p>Either your sheet is empty or the headers don't match.</p>
                    <p>Make sure Row 1 has these exact headers (case-sensitive):</p>
                    <pre>Leader | Governorship | Fellowship Attendance | Service Attendance | Offering | Selfie URL | Timestamp</pre>
                `;
            }
        }
        
        debug();
    </script>
</body>
</html>
