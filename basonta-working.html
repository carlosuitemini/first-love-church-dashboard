<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0b1120;
            color: white;
            padding: 20px;
            margin: 0;

        }

            margin: 0;
            font-size: 1.5rem;

            border-radius: 10px;

            color: white;
            cursor: pointer;

        }
        button:hover { background: #1e40af; }
        table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
            overflow-x: auto;

        }
        td, th {
            padding: 8px;
            border-bottom: 1px solid #333;

            white-space: nowrap;

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;

        .filter-bar input, .filter-bar select {
            flex: 1;
            min-width: 120px;

        }
        .chart-container {
            height: 300px;

        .lock-message {

        .submission-type {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .type-btn {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;

        }
        .type-btn.active {

        .success-msg {

        .preview-img {
            max-width: 100px;
            max-height: 100px;
            margin-top: 10px;
            border-radius: 8px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #111827;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #2c6280;
        }
        .modal-content h3 {
            color: #fbbf24;
            margin-bottom: 15px;
        }
        .summary-text {
            background: #0f172a;
            padding: 15px;

            font-family: monospace;
            font-size: 14px;
            white-space: pre-line;
            margin: 15px 0;
            border: 1px solid #334155;
        }
        .copy-btn {
            background: #10b981;
            width: 100%;
        }
        .copy-btn:hover {
            background: #059669;
        }
        .close-modal-btn {
            background: #4b5563;
            width: 100%;
            margin-top: 10px;
        }
        .close-modal-btn:hover {
            background: #374151;
        }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .panel { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-title">
        <div class="logo">
            <img src="logo.jpeg" alt="First Love Church" onerror="this.src='https://via.placeholder.com/48/0a2540/ffffff?text=FLC'">
        </div>
        <h2>Basontas | FLC-Ruiru Campus</h2>

    <div>
        <a href="index.html" style="color: white; margin-right: 15px;">Back</a>

</div>

<div class="container">
    <div class="panel" id="senderPanel">
        <h3>Submit Basonta Report</h3>
        <div id="formContainer"></div>
        <p id="status" style="margin-top:10px;"></p>
    </div>

    <div class="panel">
        <h3>Dashboard</h3>
        <div class="filter-bar">
            <input type="text" id="searchBasonta" placeholder="Search Basonta name...">
            <select id="filterType">
                <option value="">All Submissions</option>

        <div class="chart-container">

                    <tr>

                        <th>Leader</th>

                        <th>Offering</th>

                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="9" style="text-align:center">Loading data...<\/td><\/tr>
                </tbody>

        <\/div>
    <\/div>
<\/div>

<!-- Summary Modal -->
<div id="summaryModal" class="modal">
    <div class="modal-content">
        <h3>Report Summary</h3>
        <div id="summaryText" class="summary-text"></div>
        <button id="copySummaryBtn" class="copy-btn">Copy to Clipboard</button>
        <button id="closeModalBtn" class="close-modal-btn">Close</button>
    </div>
</div>

<script>
// Basonta Dashboard - With Summary Modal
const API_URL = 'https:\/\/script.google.com\/macros\/s\/AKfycbyBLNfetfiwsDw9696B6AqO7neyhuGjuO933LZT9fTECXINsSj0t_AGPjsdb-r8yeA3CQ\/exec';
const IMGBB_API_KEY = '107609db4a711a802f096fe2de2c3ce8';
const TEST_MODE = false;

let globalData = [];
let filteredData = [];
let chart;
let currentFormType = 'midweek';

const BASONTA_NAMES = ['GLC CHOIR', 'DANCING STARS', 'AIRPORT STARS', 'USHERS', 'MEDIA', 'FLOLLYWOOD STARS'];

const LEADERS_LIST = ['Evans Okumu', 'Paul Webi', 'Deborah Njorogex', 'Friend Mwaura', 'Stella Njambi', 'Charisma Angel', 'Perkins Katisa', 'Tanyasis', 'Joseph Misunga', 'Austin Peter', 'Beatrice Mueni', 'George Gute', 'Omaset Linda', 'Edwin Omondi', 'Abigail Mbogo'];

function getEATTime() {
    const now = new Date();
    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    return new Date(utc + (3 * 3600000));
}

function formatDate() {
    const d = getEATTime();
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return day + '/' + month + '/' + year;
}

function isMidweekAllowed() {
    if (TEST_MODE) return true;
    const now = getEATTime();
    const day = now.getDay();
    const hour = now.getHours();
    if (day === 3 && hour >= 18 && hour < 21) return true;
    return false;
}

function isSundayAllowed() {
    if (TEST_MODE) return true;
    const now = getEATTime();
    const day = now.getDay();
    const hour = now.getHours();
    if (day === 0 && hour >= 14 && hour < 18) return true;
    return false;
}

function getCurrentAllowedType() {
    if (isMidweekAllowed()) return "midweek";
    if (isSundayAllowed()) return "sunday";
    return null;
}

function updateAccessUI() {
    const accessDiv = document.getElementById("accessStatus");
    
    if (TEST_MODE) {
        accessDiv.innerHTML = 'TEST MODE - Both forms available';
        accessDiv.style.background = "#fbbf24";
        accessDiv.style.color = "#0b1120";
        accessDiv.classList.add('test-mode');
        return;
    }
    
    const allowedType = getCurrentAllowedType();
    
    if (allowedType === "midweek") {
        accessDiv.innerHTML = 'OPEN - Midweek (Wed 6-9pm)';
        accessDiv.style.background = "#164e2e";
        accessDiv.style.color = "white";
    } else if (allowedType === "sunday") {
        accessDiv.innerHTML = 'OPEN - Sunday (2-6pm)';
        accessDiv.style.background = "#164e2e";
        accessDiv.style.color = "white";
    } else {
        accessDiv.innerHTML = 'CLOSED - Wed 6-9pm & Sun 2-6pm EAT';
        accessDiv.style.background = "#631e1e";
        accessDiv.style.color = "white";
    }
}

async function loadData() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = '</table><td colspan="9" style="text-align:center">Loading data...<\/td><\/tr>';
    
    try {
        const url = API_URL + '?action=read&type=basonta&sheet=Sheet1';
        console.log('Fetching from:', url);
        
        const response = await fetch(url);
        const result = await response.json();
        
        console.log('API Result:', result);
        
        if (result.success && result.data) {
            globalData = result.data;
            console.log('Loaded', globalData.length, 'records from Basonta sheet');
        } else {
            globalData = [];
            console.log('No data found or error:', result.error);
        }
    } catch (error) {
        console.error("Error loading data:", error);
        globalData = [];
    }
    
    applyFilters();
}

function applyFilters() {
    const searchTerm = document.getElementById("searchBasonta").value.toLowerCase();
    const typeFilter = document.getElementById("filterType").value;
    
    filteredData = [];
    for (let i = 0; i < globalData.length; i++) {
        const item = globalData[i];
        const name = (item['Basonta Name'] || "").toLowerCase();
        const matchesSearch = name.indexOf(searchTerm) !== -1;
        
        let submissionType = 'midweek';
        if (item['Submission Type'] === 'sunday' || item['Meeting Attendance'] || item['Stage Attendance']) {
            submissionType = 'sunday';
        }
        
        const matchesType = (typeFilter === "") || (submissionType === typeFilter);
        
        if (matchesSearch && matchesType) {
            item.submissionType = submissionType;
            filteredData.push(item);
        }
    }
    
    renderTable();
    updateChart();
}

function renderTable() {
    const tbody = document.getElementById("tableBody");
    
    if (filteredData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center">No data found<\/td><\/tr>';
        return;
    }
    
    let html = '';
    for (let i = 0; i < filteredData.length; i++) {
        const d = filteredData[i];
        let attendance = '';
        let newConverts = '';
        let firstTimers = '';
        let offering = '';
        
        if (d.submissionType === 'midweek') {
            attendance = d['Total Attendance'] || 0;
            newConverts = d['New Converts'] || 0;
            firstTimers = d['First Timers'] || 0;
            offering = d.Offering || 0;
        } else {
            const meeting = d['Meeting Attendance'] || 0;
            const stage = d['Stage Attendance'] || 0;
            const church = d['Church Attendance'] || 0;
            attendance = 'M:' + meeting + ' S:' + stage + ' C:' + church;
            newConverts = d['Deep Sea Fishing'] || 0;
            firstTimers = '-';
            offering = '-';
        }
        
        const typeText = (d.submissionType === 'midweek') ? 'Midweek' : 'Sunday';
        const nameText = escapeHtml(d['Basonta Name'] || '');
        const leaderText = escapeHtml(d['Leader'] || d['Sonta Leader'] || '');
        const governorshipText = escapeHtml(d.Governorship || '');
        const dateText = d.Timestamp ? new Date(d.Timestamp).toLocaleDateString() : '';
        
        html += '<tr>';
        html += '<td>' + nameText + '<\/td>';
        html += '<td>' + leaderText + '<\/td>';
        html += '<td>' + governorshipText + '<\/td>';
        html += '<td>' + typeText + '<\/td>';
        html += '<td>' + attendance + '<\/td>';
        html += '<td>' + newConverts + '<\/td>';
        html += '<td>' + firstTimers + '<\/td>';
        html += '<td>' + offering + '<\/td>';
        html += '<td>' + dateText + '<\/td>';
        html += '<\/tr>';
    }
    
    tbody.innerHTML = html;
}

function updateChart() {
    const ctx = document.getElementById("chart").getContext("2d");
    if (chart) chart.destroy();
    
    if (filteredData.length === 0) {
        chart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [] } });
        return;
    }
    
    const weekMap = new Map();
    for (let i = 0; i < filteredData.length; i++) {
        const item = filteredData[i];
        let date = item.Timestamp ? new Date(item.Timestamp) : new Date();
        const year = date.getFullYear();
        const month = date.getMonth();
        const week = Math.ceil(date.getDate() / 7);
        const weekLabel = getMonthName(month) + ' Week ' + week;
        
        if (!weekMap.has(weekLabel)) {
            weekMap.set(weekLabel, { attendance: 0, offering: 0 });
        }
        const curr = weekMap.get(weekLabel);
        
        if (item.submissionType === 'midweek') {
            curr.attendance += item['Total Attendance'] || 0;
        } else {
            curr.attendance += (item['Meeting Attendance'] || 0) + (item['Stage Attendance'] || 0) + (item['Church Attendance'] || 0);
        }
        curr.offering += item.Offering || 0;
    }
    
    const sortedWeeks = Array.from(weekMap.keys()).sort();
    const attendanceData = [];
    const offeringData = [];
    
    for (let i = 0; i < sortedWeeks.length; i++) {
        const w = sortedWeeks[i];
        attendanceData.push(weekMap.get(w).attendance);
        offeringData.push(weekMap.get(w).offering);
    }
    
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: sortedWeeks,
            datasets: [
                { label: 'Total Attendance', data: attendanceData, borderColor: '#3b82f6', backgroundColor: 'transparent', tension: 0.2 },
                { label: 'Offering (KES)', data: offeringData, borderColor: '#f59e0b', backgroundColor: 'transparent', tension: 0.2 }
            ]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

function getMonthName(monthIndex) {
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return months[monthIndex];
}

function showSummaryModal(summaryText) {
    const modal = document.getElementById('summaryModal');
    const summaryDiv = document.getElementById('summaryText');
    summaryDiv.innerText = summaryText;
    modal.style.display = 'flex';
}

function setupModalButtons() {
    const copyBtn = document.getElementById('copySummaryBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const modal = document.getElementById('summaryModal');
    
    copyBtn.onclick = function() {
        const summaryText = document.getElementById('summaryText').innerText;
        navigator.clipboard.writeText(summaryText).then(function() {
            copyBtn.innerText = 'Copied!';
            setTimeout(function() {
                copyBtn.innerText = 'Copy to Clipboard';
            }, 2000);
        });
    };
    
    closeBtn.onclick = function() {
        modal.style.display = 'none';
    };
    
    window.onclick = function(event) {
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    };
}

function switchFormType(type) {
    currentFormType = type;
    renderFormByType();
}

async function uploadToImgBB(file) {
    const formData = new FormData();
    formData.append("image", file);
    
    const response = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, {
        method: "POST",
        body: formData
    });
    
    const result = await response.json();
    if (result.success) {
        return result.data.url;
    } else {
        throw new Error("Image upload failed");
    }
}

function renderFormByType() {
    const container = document.getElementById("formContainer");
    const allowedType = getCurrentAllowedType();
    
    if (!allowedType && !TEST_MODE) {
        container.innerHTML = '<div class="lock-message">Submissions allowed:<br>Wednesday 6:00 PM - 9:00 PM (Midweek)<br>Sunday 2:00 PM - 6:00 PM<br>EAT Timezone<\/div>';
        return;
    }
    
    if (currentFormType === "midweek") {
        let leaderOptions = '';
        for (let i = 0; i < LEADERS_LIST.length; i++) {
            leaderOptions += '<option value="' + LEADERS_LIST[i] + '">' + LEADERS_LIST[i] + '</option>';
        }
        
        container.innerHTML = '<div class="submission-type"><div class="type-btn active" onclick="switchFormType(\'midweek\')">Midweek Report (Wed 6-9pm)</div><div class="type-btn" onclick="switchFormType(\'sunday\')">Sunday Report (2-6pm)</div></div><label>Governorship</label><select id="governorshipSelect" required><option value="">Select Governorship</option><option>Juja Governorship</option><option>KU Governorship</option><option>Kiriri Governorship</option></select><label>Basonta Name</label><input type="text" id="basontaName" placeholder="Basonta Name" required><label>Basonta Fellowship Leader</label><select id="leaderName" required><option value="">Select Leader</option>' + leaderOptions + '</select><label>Total Attendance</label><input type="number" id="totalAttendance" value="0"><label>New Converts</label><input type="number" id="newConverts" value="0"><label>First Timers</label><input type="number" id="firstTimers" value="0"><label>Offering (KES)</label><input type="number" id="offering" value="0"><label>Photo/Selfie</label><input type="file" id="imageUpload" accept="image/*"><div id="imagePreview"></div><button id="submitBtn">Submit Midweek Report</button>';
    } else {
        let basontaOptions = '';
        for (let i = 0; i < BASONTA_NAMES.length; i++) {
            basontaOptions += '<option value="' + BASONTA_NAMES[i] + '">' + BASONTA_NAMES[i] + '</option>';
        }
        
        let leaderOptions = '';
        for (let i = 0; i < LEADERS_LIST.length; i++) {
            leaderOptions += '<option value="' + LEADERS_LIST[i] + '">' + LEADERS_LIST[i] + '</option>';
        }
        
        container.innerHTML = '<div class="submission-type"><div class="type-btn" onclick="switchFormType(\'midweek\')">Midweek Report (Wed 6-9pm)</div><div class="type-btn active" onclick="switchFormType(\'sunday\')">Sunday Report (2-6pm)</div></div><label>Basonta Name</label><select id="basontaName" required><option value="">Select Basonta</option>' + basontaOptions + '</select><label>Sonta Leader Name</label><select id="sontaLeader" required><option value="">Select Leader</option>' + leaderOptions + '</select><label>Meeting Attendance</label><input type="number" id="meetingAttendance" value="0"><label>Stage Attendance</label><input type="number" id="stageAttendance" value="0"><label>Church Attendance</label><input type="number" id="churchAttendance" value="0"><label>Deep Sea Fishing (New Converts)</label><input type="number" id="deepSeaFishing" value="0"><label>Photo/Selfie</label><input type="file" id="imageUpload" accept="image/*"><div id="imagePreview"></div><button id="submitBtn">Submit Sunday Report</button>';
    }
    
    const fileInput = document.getElementById("imageUpload");
    if (fileInput) {
        fileInput.onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    document.getElementById("imagePreview").innerHTML = '<img src="' + ev.target.result + '" class="preview-img">';
                };
                reader.readAsDataURL(file);
            }
        };
    }
    
    document.getElementById("submitBtn").onclick = submitData;
}

function renderForm() {
    renderFormByType();
}

async function submitData() {
    const status = document.getElementById("status");
    
    const fileInput = document.getElementById("imageUpload");
    const file = fileInput ? fileInput.files[0] : null;
    
    let imageUrl = "";
    if (file) {
        status.innerHTML = '<span style="color: #3b82f6;">Uploading image...</span>';
        try {
            imageUrl = await uploadToImgBB(file);
        } catch (error) {
            status.innerHTML = '<span class="error-msg">Image upload failed</span>';
            return;
        }
    }
    
    if (currentFormType === "midweek") {
        const governorship = document.getElementById("governorshipSelect").value;
        const basontaName = document.getElementById("basontaName").value.trim();
        const leaderName = document.getElementById("leaderName").value;
        const totalAttendance = parseInt(document.getElementById("totalAttendance").value) || 0;
        const newConverts = parseInt(document.getElementById("newConverts").value) || 0;
        const firstTimers = parseInt(document.getElementById("firstTimers").value) || 0;
        const offering = parseInt(document.getElementById("offering").value) || 0;
        
        if (!governorship) { status.innerHTML = '<span class="error-msg">Governorship required</span>'; return; }
        if (!basontaName) { status.innerHTML = '<span class="error-msg">Basonta name required</span>'; return; }
        if (!leaderName) { status.innerHTML = '<span class="error-msg">Leader name required</span>'; return; }
        
        status.innerHTML = '<span style="color: #3b82f6;">Submitting...</span>';
        
        const params = new URLSearchParams();
        params.append('action', 'write');
        params.append('type', 'basonta');
        params.append('sheet', 'Sheet1');
        params.append('Basonta Name', basontaName);
        params.append('Leader', leaderName);
        params.append('Governorship', governorship);
        params.append('Submission Type', 'midweek');
        params.append('Total Attendance', totalAttendance);
        params.append('New Converts', newConverts);
        params.append('First Timers', firstTimers);
        params.append('Offering', offering);
        params.append('Selfie URL', imageUrl);
        
        const fullUrl = API_URL + '?' + params.toString();
        
        try {
            const response = await fetch(fullUrl);
            const text = await response.text();
            
            if (text.indexOf('Success') !== -1 || text.indexOf('success') !== -1) {
                const currentDate = formatDate();
                const summaryText = `Name of Basonta: ${basontaName}
Name of Basonta Fellowship Leader: ${leaderName}
Governorship: ${governorship}
Date: ${currentDate}
Total Attendance: ${totalAttendance}
New Converts: ${newConverts}
First Timers: ${firstTimers}
Offering: KES ${offering}`;
                
                showSummaryModal(summaryText);
                
                status.innerHTML = '<span class="success-msg">Midweek report submitted successfully!</span>';
                document.getElementById("governorshipSelect").value = "";
                document.getElementById("basontaName").value = "";
                document.getElementById("leaderName").value = "";
                document.getElementById("totalAttendance").value = "0";
                document.getElementById("newConverts").value = "0";
                document.getElementById("firstTimers").value = "0";
                document.getElementById("offering").value = "0";
                if (fileInput) fileInput.value = "";
                document.getElementById("imagePreview").innerHTML = "";
                
                setTimeout(async function() {
                    await loadData();
                    status.innerHTML = '';
                }, 2000);
            } else {
                status.innerHTML = '<span class="error-msg">Submission failed</span>';
            }
        } catch (error) {
            status.innerHTML = '<span class="error-msg">Error: ' + error.message + '</span>';
        }
        
    } else {
        const basontaName = document.getElementById("basontaName").value;
        const sontaLeader = document.getElementById("sontaLeader").value;
        const meetingAttendance = parseInt(document.getElementById("meetingAttendance").value) || 0;
        const stageAttendance = parseInt(document.getElementById("stageAttendance").value) || 0;
        const churchAttendance = parseInt(document.getElementById("churchAttendance").value) || 0;
        const deepSeaFishing = parseInt(document.getElementById("deepSeaFishing").value) || 0;
        
        if (!basontaName) { status.innerHTML = '<span class="error-msg">Basonta name required</span>'; return; }
        if (!sontaLeader) { status.innerHTML = '<span class="error-msg">Sonta leader name required</span>'; return; }
        
        status.innerHTML = '<span style="color: #3b82f6;">Submitting...</span>';
        
        const params = new URLSearchParams();
        params.append('action', 'write');
        params.append('type', 'basonta');
        params.append('sheet', 'Sheet1');
        params.append('Basonta Name', basontaName);
        params.append('Sonta Leader', sontaLeader);
        params.append('Submission Type', 'sunday');
        params.append('Meeting Attendance', meetingAttendance);
        params.append('Stage Attendance', stageAttendance);
        params.append('Church Attendance', churchAttendance);
        params.append('Deep Sea Fishing', deepSeaFishing);
        params.append('Selfie URL', imageUrl);
        
        const fullUrl = API_URL + '?' + params.toString();
        
        try {
            const response = await fetch(fullUrl);
            const text = await response.text();
            
            if (text.indexOf('Success') !== -1 || text.indexOf('success') !== -1) {
                const currentDate = formatDate();
                const meetingAtt = String(meetingAttendance).padStart(2, '0');
                const stageAtt = String(stageAttendance).padStart(2, '0');
                const churchAtt = String(churchAttendance).padStart(2, '0');
                const deepSea = String(deepSeaFishing).padStart(2, '0');
                
                const summaryText = `Name of Basonta: ${basontaName}
Name of Sonta leader: ${sontaLeader}
Date: ${currentDate}
Meeting attendance: ${meetingAtt}
Stage attendance: ${stageAtt}
Attendance in church: ${churchAtt}
Deep sea fishing: ${deepSea}`;
                
                showSummaryModal(summaryText);
                
                status.innerHTML = '<span class="success-msg">Sunday report submitted successfully!</span>';
                document.getElementById("basontaName").value = "";
                document.getElementById("sontaLeader").value = "";
                document.getElementById("meetingAttendance").value = "0";
                document.getElementById("stageAttendance").value = "0";
                document.getElementById("churchAttendance").value = "0";
                document.getElementById("deepSeaFishing").value = "0";
                if (fileInput) fileInput.value = "";
                document.getElementById("imagePreview").innerHTML = "";
                
                setTimeout(async function() {
                    await loadData();
                    status.innerHTML = '';
                }, 2000);
            } else {
                status.innerHTML = '<span class="error-msg">Submission failed</span>';
            }
        } catch (error) {
            status.innerHTML = '<span class="error-msg">Error: ' + error.message + '</span>';
        }
    }
}

function exportToExcel() {
    if (filteredData.length === 0) {
        alert('No data to export!');
        return;
    }
    const ws = XLSX.utils.json_to_sheet(filteredData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Basonta_Data');
    const dateStr = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, 'Basonta_Reports_' + dateStr + '.xlsx');
}

document.getElementById("searchBasonta")?.addEventListener("input", function() { applyFilters(); });
document.getElementById("filterType")?.addEventListener("change", function() { applyFilters(); });
document.getElementById("resetFilters")?.addEventListener("click", function() {
    document.getElementById("searchBasonta").value = "";
    document.getElementById("filterType").value = "";
    applyFilters();
});
document.getElementById("exportBtn")?.addEventListener("click", exportToExcel);

window.switchFormType = switchFormType;

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}
