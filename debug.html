<!DOCTYPE html>
<html>
<head>
    <title>Debug FLC Connection</title>
    <style>
        body { background: #0b1120; color: white; font-family: monospace; padding: 20px; }
        .error { color: #ef4444; }
        .success { color: #10b981; }
        .info { color: #3b82f6; }
        pre { background: #111827; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Debugging FLC Connection</h1>
    <div id="step1"></div>
    <div id="step2"></div>
    <div id="step3"></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzUZmTZVPcvFHIideed4nImlXNWfszCybBVzyOTm6lYMGhcqke4aJaaRZMJyq2X9LS8/exec';
        
        // STEP 1: Just fetch and see what comes back (don't parse as JSON)
        async function step1() {
            const div = document.getElementById('step1');
            div.innerHTML = '<span class="info">Step 1: Fetching URL to see raw response...</span><br>';
            
            try {
                const response = await fetch(API_URL);
                const rawText = await response.text();
                
                div.innerHTML += `<span class="info">Status: ${response.status}</span><br>`;
                div.innerHTML += `<span class="info">Content-Type: ${response.headers.get('content-type')}</span><br>`;
                div.innerHTML += `<span class="info">First 500 characters of response:</span><br>`;
                div.innerHTML += `<pre>${rawText.substring(0, 500)}</pre>`;
                
                return rawText;
            } catch (error) {
                div.innerHTML += `<span class="error">Error: ${error.message}</span><br>`;
                return null;
            }
        }
        
        // Run step 1 automatically
        step1();
    </script>
</body>
</html>
